apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: avitam-teach
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: avitam-teach
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: avitam-teach
      containers:
        - name: web
          image: WEB_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: avitam-teach-config
            - secretRef:
                name: avitam-teach-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: avitam-teach
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: avitam-teach
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: avitam-teach
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: avitam-teach
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: avitam-teach
      containers:
        - name: worker
          image: WORKER_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: avitam-teach-config
            - secretRef:
                name: avitam-teach-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
