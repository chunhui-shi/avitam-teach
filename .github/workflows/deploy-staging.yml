name: Deploy temporary Azure staging

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to deploy
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: avitam-teach-azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    env:
      AVITAM_AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AVITAM_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - name: Provision standalone Azure staging
        run: infra/azure/staging.sh create
      - name: Build, migrate, and release
        run: infra/azure/staging.sh deploy
      - name: Verify and record evidence
        run: infra/azure/staging.sh verify | tee staging-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-staging-evidence
          path: staging-evidence.txt
