name: CI

on:
  push:
    branches: [main]
  pull_request:

# The merge gate: lint, typecheck, and the integration test suite must pass
# against a real Postgres before a change can land.
jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: avitam_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/avitam_test

    defaults:
      run:
        working-directory: spine

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  delivery-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - name: Validate Azure deployment artifacts
        run: |
          bash -n infra/azure/staging.sh
          kubectl create --dry-run=client --validate=false -f infra/azure/k8s/database.yaml -o yaml >/dev/null
          sed -e 's|WEB_IMAGE|example.invalid/web@sha256:0000|g' \
              -e 's|WORKER_IMAGE|example.invalid/worker@sha256:0000|g' \
              infra/azure/k8s/workloads.yaml | \
            kubectl create --dry-run=client --validate=false -f - -o yaml >/dev/null
          sed -e 's|WORKER_IMAGE|example.invalid/worker@sha256:0000|g' \
              infra/azure/k8s/migration-job.yaml | \
            kubectl create --dry-run=client --validate=false -f - -o yaml >/dev/null
      - name: Build web image
        working-directory: spine
        run: docker build --target runner -t avitam-teach-web:ci .
      - name: Build worker image
        working-directory: spine
        run: docker build --target worker -t avitam-teach-worker:ci .
